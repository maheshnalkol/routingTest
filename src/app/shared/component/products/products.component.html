<div class="row mt-5">
  <div class="col-md-4">
    <ul class="list-group" *ngIf="prodArr.length > 0; else nodata">
      <li
        [ngClass]="{
          active: isProdActive == prod
        }"
        (click)="onselect(prod)"
        [queryParams]="{ canReturn: prod.canReturn }"
        routerLink="{{ prod.prodId }}"
        *ngFor="let prod of prodArr"
        class="list-group-item text-center mb-3"
        style="cursor: pointer"
      >
        {{ prod.pName }}
      </li>
    </ul>
    <ng-template #nodata>
      <p class="alert alert-info text-center text-danger">
        Products are not added yet...!!!
      </p>
    </ng-template>
  </div>
  <div class="col-md-4">
    <router-outlet></router-outlet>
  </div>
  <div class="col-md-2">
    <button routerLink="addproduct" mat-raised-button color="primary">
      Add Products
    </button>
  </div>
</div>
