<mat-card>
  <mat-card-content>
    <p>{{ data }}</p>
  </mat-card-content>
  <mat-divider> </mat-divider>
  <mat-card-actions class="d-flex justify-content-between">
    <button (click)="onuserClick(true)" mat-raised-button color="primary">
      Confirm
    </button>
    <button (click)="onuserClick(false)" mat-raised-button color="accent">
      Cancel
    </button>
  </mat-card-actions>
</mat-card>
